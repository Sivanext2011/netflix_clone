apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflixclone
  labels:
    app.kubernetes.io/name: netflixclone
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: netflixclone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netflixclone
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netflixclone
          image: docker.io/sivanext/netflix_clone:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: netflixclone-config
            - secretRef:
                name: netflixclone-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
