apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflixclone
  namespace: devsecops
  labels:
    app.kubernetes.io/name: netflixclone
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: netflixclone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netflixclone
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netflixclone
          image: docker.io/sivanext/netflixclone:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: netflixclone-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netflixclone-secret
                  key: API_TOKEN
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
